---
# Core gem5 build + C++ unit tests for the DPRH fork.
#
# Goal: prove that the DPRH gem5 fork still COMPILES and its C++ unit tests
# pass on Linux. This deliberately does NOT run any simulation (no gem5
# invocation on a workload) -- it only builds gem5 and runs gem5's own gtest
# suite, which is the fast, deterministic "does the core still work" signal.
#
# Runs on every push and before a merge (pull_request).
#
# Uses the official gem5 all-dependencies Docker image so no toolchain/deps
# install is needed, plus ccache (persisted via actions/cache) to keep repeat
# builds fast. The two jobs run on separate GitHub-hosted runners so each gets
# a full disk allowance for its own build tree.

name: Build & Unit Tests

on:
    push:
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    get-date:
        # Date label for the ccache cache key: the first run each day is a
        # miss and repopulates the cache; later runs that day are warm.
        runs-on: ubuntu-latest
        outputs:
            date: ${{ steps.date.outputs.date }}
        steps:
            - id: date
              run: echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

    unittests:
        # Compiles the core gem5 objects and RUNS gem5's C++ gtest unit tests.
        # No simulation is executed. dprh_filter.test.cc is picked up here.
        needs: [get-date]
        runs-on: ubuntu-latest
        container: ghcr.io/gem5/ubuntu-24.04_all-dependencies:latest
        timeout-minutes: 120
        env:
            CCACHE_DIR: ${{ github.workspace }}/.ccache
            CCACHE_MAXSIZE: 2G
        steps:
            - name: Checkout (with gem5 submodule)
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Install ccache
              # Put ccache's compiler shims (/usr/lib/ccache/{gcc,g++}) on PATH
              # so gem5 transparently compiles through ccache. gem5's SConstruct
              # treats $CXX as a single executable, so `CXX="ccache g++"` breaks
              # it -- the PATH-shim approach is the supported way.
              run: |
                  apt-get update && apt-get install -y ccache
                  echo "/usr/lib/ccache" >> "$GITHUB_PATH"

            - name: Restore ccache
              uses: actions/cache@v4
              with:
                  path: ${{ github.workspace }}/.ccache
                  key: ccache-unittests-${{ needs.get-date.outputs.date }}
                  restore-keys: |
                      ccache-unittests-

            - name: Build & run C++ unit tests (no simulation)
              working-directory: gem5
              run: scons --no-compress-debug build/ALL/unittests.opt -j "$(nproc)"

            - name: ccache stats
              if: always()
              run: ccache -s

    compile-gem5:
        # Proves the DPRH X86 gem5.opt binary compiles and links on Linux.
        # `--build-info` just prints build config and exits -- it is NOT a
        # simulation.
        needs: [get-date]
        runs-on: ubuntu-latest
        container: ghcr.io/gem5/ubuntu-24.04_all-dependencies:latest
        timeout-minutes: 120
        env:
            CCACHE_DIR: ${{ github.workspace }}/.ccache
            CCACHE_MAXSIZE: 2G
        steps:
            - name: Checkout (with gem5 submodule)
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Install ccache
              # Put ccache's compiler shims (/usr/lib/ccache/{gcc,g++}) on PATH
              # so gem5 transparently compiles through ccache. gem5's SConstruct
              # treats $CXX as a single executable, so `CXX="ccache g++"` breaks
              # it -- the PATH-shim approach is the supported way.
              run: |
                  apt-get update && apt-get install -y ccache
                  echo "/usr/lib/ccache" >> "$GITHUB_PATH"

            - name: Restore ccache
              uses: actions/cache@v4
              with:
                  path: ${{ github.workspace }}/.ccache
                  key: ccache-x86opt-${{ needs.get-date.outputs.date }}
                  restore-keys: |
                      ccache-x86opt-

            - name: Build gem5.opt (X86)
              working-directory: gem5
              run: scons --no-compress-debug build/X86/gem5.opt -j "$(nproc)"

            - name: Sanity check binary links (no simulation)
              # --build-info prints build config and sys.exit(0)s without
              # running a simulation. (gem5 has no --version flag.)
              working-directory: gem5
              run: ./build/X86/gem5.opt --build-info

            - name: DPRH config elaboration smoke
              # Actually run m5.instantiate() on both DPRH configs so port/param
              # wiring bugs are caught in CI instead of on the cluster. This is
              # the gap that let read_buffer_size (wrong SimObject), the X86 APIC
              # bus placement, and the switched-CPU topology through -- none are
              # visible to the build or the gtests, only to elaboration. A tiny
              # workload + a 1-instruction measure window keeps it to seconds
              # while exercising instantiate + switchCpus + a real read/switch.
              # This job runs in a container, where the default shell is `sh`
              # (dash) -- which lacks `set -o pipefail`; pin to bash explicitly.
              working-directory: gem5
              shell: bash
              run: |
                  set -euo pipefail
                  HELLO=tests/test-progs/hello/bin/x86/linux/hello
                  ./build/X86/gem5.opt --outdir=/tmp/elab_se \
                      configs/dprh/run_se.py --config B1 --prefetcher spp \
                      --cmd "$HELLO" --ff-offset 0 --warmup 0 --measure 1
                  ./build/X86/gem5.opt --outdir=/tmp/elab_tgen \
                      configs/dprh/run_trafficgen.py --config B1 \
                      --demand-period 1000 --pf-seq-pkts 4 --pf-tag --period 100000
                  test -s /tmp/elab_se/stats.txt
                  test -s /tmp/elab_tgen/stats.txt
                  echo "DPRH elaboration smoke: OK"

            - name: DPRH V1 prefetch-provenance smoke
              working-directory: gem5
              shell: bash
              run: |
                  set -euo pipefail
                  HELLO=tests/test-progs/hello/bin/x86/linux/hello
                  ./build/X86/gem5.opt --outdir=/tmp/v1_se \
                      configs/dprh/run_se.py --config B1 --prefetcher spp \
                      --cmd "$HELLO" --ff-offset 0 --warmup 0 --measure 5000000
                  STATS=/tmp/v1_se/stats.txt
                  test -s "$STATS"
                  awk '
                      $1 == "system.cpu.l2cache.prefetcher.pfIssued" && $2 > 0 { found = 1 }
                      END { exit !found }
                  ' "$STATS"
                  awk '
                      $1 == "system.mem_ctrl.prefetchEnqueued" && $2 > 0 { found = 1 }
                      END { exit !found }
                  ' "$STATS"
                  grep -E 'system.cpu.l2cache.prefetcher.pfIssued|system.mem_ctrl.prefetchEnqueued' \
                      "$STATS"
                  echo "DPRH V1 prefetch provenance: OK"

            - name: ccache stats
              if: always()
              run: ccache -s
